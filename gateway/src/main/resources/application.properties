spring.application.name=gateway

server.port=9090

spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=${GATEWAY_URI:http://localhost:9091}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/patients/**

spring.cloud.gateway.server.webflux.routes[1].id=notes-service
spring.cloud.gateway.server.webflux.routes[1].uri=${NOTES_URI:http://localhost:9094}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notes/**

spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=${AUTH_URI:http://localhost:9093}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/auth/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[3].id=risk-service
spring.cloud.gateway.server.webflux.routes[3].uri=${RISK_URI:http://localhost:9095}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/risk/**

jwt.secretKey=${JWT_SECRET}