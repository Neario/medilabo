services:
  medilabo-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - medilabo-db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  medilabo-auth-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${AUTH_MYSQL}
      MYSQL_USER: ${AUTH_MYSQL_USER}
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD}
    volumes:
      - medilabo-auth-db-data:/var/lib/mysql
      - ./db/auth-init.sql:/docker-entrypoint-initdb.d/auth-init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUTH_MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    depends_on:
      - patient
    ports:
      - "9090:9090"
    environment:
      GATEWAY_URI: ${PATIENT_URI}

  patient:
    build: ./patient
    environment:
      DB_URL: jdbc:mysql://medilabo-db:3306/${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      medilabo-db:
        condition: service_healthy
    ports:
      - "9091:9091"

  web:
    build: ./web
    environment:
      GATEWAY_URL: ${GATEWAY_URI}
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "9092:9092"

  auth:
    build: ./auth
    environment:
      DB_URL: jdbc:mysql://medilabo-auth-db:3306/${AUTH_MYSQL}
      DB_USER: ${AUTH_MYSQL_USER}
      DB_PASSWORD: ${AUTH_MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      gateway:
        condition: service_started
      medilabo-auth-db:
        condition: service_healthy
    ports:
      - "9093:9093"

  adminer:
    image: adminer
    depends_on:
      - medilabo-db
    ports:
      - "8081:8080"

volumes:
  medilabo-db-data:
  medilabo-auth-db-data:
