<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|Patient - ${patient.firstName}|"></title>
</head>
<body>
    <h1>Info Patient</h1>
    <table>
        <thead>
        <tr>
            <th>FirstName</th>
            <th>LastName</th>
            <th>BirthDate</th>
            <th>Gender</th>
            <th>PhoneNumber</th>
            <th>Address</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${patient.firstName}"></td>
            <td th:text="${patient.lastName}"></td>
            <td th:text="${patient.birthDate}"></td>
            <td th:text="${patient.gender}"></td>
            <td th:text="${patient.phoneNumber}"></td>
            <td th:text="${patient.address}"></td>
        </tr>
        </tbody>
    </table>
</body>
</html>
