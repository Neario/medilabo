<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients list</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <h1>Patients</h1>
    <a th:href="@{/patients/create}" class="btn btn-primary mb-3">Nouveau patient</a>
    <table>
        <thead>
            <tr>
                <th>FirstName</th>
                <th>LastName</th>
                <th>BirthDate</th>
                <th>Gender</th>
                <th>PhoneNumber</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.firstName}"></td>
                <td th:text="${patient.lastName}"></td>
                <td th:text="${patient.birthDate}"></td>
                <td th:text="${patient.gender}"></td>
                <td th:text="${patient.phoneNumber}"></td>
                <td th:text="${patient.address}"></td>
                <td>
                    <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-eye"></i>
                    <a th:href="@{/patients/{id}/edit(id=${patient.id})}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-pencil"></i>
                </a></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
